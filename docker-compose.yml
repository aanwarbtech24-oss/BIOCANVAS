services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - BIOCANVAS_DEBUG=false
      - BIOCANVAS_LOG_LEVEL=info
      - BIOCANVAS_CORS_ORIGINS=["http://localhost","http://localhost:80","http://localhost:5173"]
      - BIOCANVAS_MAX_CONCURRENT_DOCKING=4
      - BIOCANVAS_RATE_LIMIT=10
      - BIOCANVAS_RATE_WINDOW=60
    volumes:
      - docking_data:/app/docking_jobs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  docking_data:
